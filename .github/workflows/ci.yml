name: CI/CD Pipeline

on:
  push:
    branches: [main, preproduction, development]
  pull_request:
    branches: [main, preproduction, development]

env:
  NODE_VERSION: '24.13.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ==========================================
  # LINT & TYPE CHECK
  # ==========================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma Schema Validate
        run: pnpm exec prisma validate

      - name: Run ESLint
        run: pnpm run lint

      - name: Install deterministic IANA build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gawk

      - name: Verify authenticated IANA timezone sources
        run: pnpm verify:iana-timezones
        env:
          IANA_TZDB_RELEASE_SHA512: ${{ vars.IANA_TZDB_RELEASE_SHA512 }}
          IANA_TZDB_SIGNER_FINGERPRINT: ${{ vars.IANA_TZDB_SIGNER_FINGERPRINT }}
          IANA_TZDB_SIGNER_PUBLIC_KEY_B64: ${{ vars.IANA_TZDB_SIGNER_PUBLIC_KEY_B64 }}

      - name: Type check
        run: pnpm run build

  # ==========================================
  # UNIT TESTS
  # ==========================================
  backend_unit_tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALLOW_AUTHORIZATION_P0_INTEGRATION_DB: '1'
      AUTHORIZATION_P0_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run unit tests
        # TypeScript 6 requires an explicit rootDir when ts-jest compiles each
        # spec file in isolation; keep the CI gate blocking without changing
        # the project tsconfig in this hardening slice.
        # Cap workers: AUTHORIZATION_P0 dbIt suites share one Postgres and use
        # ACCESS EXCLUSIVE locks; high parallelism flakes on lock/statement timeouts.
        run: pnpm jest --coverage --passWithNoTests --maxWorkers=50% --globals '{"ts-jest":{"tsconfig":{"rootDir":"."}}}'

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  redis_contract:
    name: Redis Contract
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ALLOW_REDIS_INTEGRATION: '1'
      REDIS_INTEGRATION_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run Redis contract
        run: pnpm exec jest --runInBand --runTestsByPath src/config/redis-throttler.storage.integration.spec.ts --testPathIgnorePatterns='^$' --globals '{"ts-jest":{"tsconfig":{"rootDir":"."}}}'

  cross_repo_contract:
    name: Cross-repo Contract
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    env:
      SACDIA_ROOT_CONTRACT_REF: ${{ vars.SACDIA_ROOT_CONTRACT_REF }}
      SACDIA_ADMIN_CONTRACT_REF: ${{ vars.SACDIA_ADMIN_CONTRACT_REF }}
      SACDIA_APP_CONTRACT_REF: ${{ vars.SACDIA_APP_CONTRACT_REF }}

    steps:
      - name: Validate immutable contract refs
        run: |
          for ref in \
            "$SACDIA_ROOT_CONTRACT_REF" \
            "$SACDIA_ADMIN_CONTRACT_REF" \
            "$SACDIA_APP_CONTRACT_REF"
          do
            [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || exit 1
          done

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout canonical docs
        run: |
          git init .contract-sources/sacdia
          git -C .contract-sources/sacdia fetch --depth=1 https://github.com/abn-r/sacdia.git "$SACDIA_ROOT_CONTRACT_REF"
          git -C .contract-sources/sacdia checkout --detach FETCH_HEAD

      - name: Checkout admin consumer
        uses: actions/checkout@v4
        with:
          repository: abn-r/sacdia-admin
          ref: ${{ env.SACDIA_ADMIN_CONTRACT_REF }}
          path: .contract-sources/sacdia-admin
          persist-credentials: false

      - name: Checkout Flutter consumer
        uses: actions/checkout@v4
        with:
          repository: abn-r/sacdia-app
          ref: ${{ env.SACDIA_APP_CONTRACT_REF }}
          path: .contract-sources/sacdia-app
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact cross-repository contract
        env:
          ALLOW_AUTHORIZATION_P0_CROSS_REPO: '1'
          SACDIA_ADMIN_ROOT: ${{ github.workspace }}/.contract-sources/sacdia-admin
          SACDIA_APP_ROOT: ${{ github.workspace }}/.contract-sources/sacdia-app
          SACDIA_CANONICAL_DOCS_ROOT: ${{ github.workspace }}/.contract-sources/sacdia
        run: pnpm exec jest --runTestsByPath src/common/verify-authorization-director-succession-p0-crossrepo.spec.ts

  required_unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [backend_unit_tests, cross_repo_contract, redis_contract]
    if: ${{ always() }}
    steps:
      - name: Require all test gates
        env:
          BACKEND_RESULT: ${{ needs.backend_unit_tests.result }}
          CROSS_REPO_RESULT: ${{ needs.cross_repo_contract.result }}
          REDIS_RESULT: ${{ needs.redis_contract.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$CROSS_REPO_RESULT" = success
          test "$REDIS_RESULT" = success

  # ==========================================
  # BUILD CHECK
  # ==========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: required_unit_tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ==========================================
  # DEPLOY — Backend deploys to Render.com (auto-deploy from main branch)
  # ==========================================
  # No manual deploy step needed — Render watches the repo directly.
