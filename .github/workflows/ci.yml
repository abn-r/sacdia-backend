name: CI/CD Pipeline

on:
  push:
    branches: [main, preproduction, development]
  pull_request:
    branches: [main, preproduction, development]

env:
  NODE_VERSION: '24.13.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ==========================================
  # LINT & TYPE CHECK
  # ==========================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma Schema Validate
        run: pnpm exec prisma validate

      - name: Run ESLint
        run: pnpm run lint

      - name: Install deterministic IANA build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gawk

      - name: Verify authenticated IANA timezone sources
        run: pnpm verify:iana-timezones
        env:
          IANA_TZDB_RELEASE_SHA512: ${{ vars.IANA_TZDB_RELEASE_SHA512 }}
          IANA_TZDB_SIGNER_FINGERPRINT: ${{ vars.IANA_TZDB_SIGNER_FINGERPRINT }}
          IANA_TZDB_SIGNER_PUBLIC_KEY_B64: ${{ vars.IANA_TZDB_SIGNER_PUBLIC_KEY_B64 }}

      - name: Type check
        run: pnpm run build

  # ==========================================
  # UNIT TESTS
  # ==========================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALLOW_AUTHORIZATION_P0_INTEGRATION_DB: '1'
      AUTHORIZATION_P0_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run unit tests
        # TypeScript 6 requires an explicit rootDir when ts-jest compiles each
        # spec file in isolation; keep the CI gate blocking without changing
        # the project tsconfig in this hardening slice.
        run: pnpm jest --coverage --passWithNoTests --globals '{"ts-jest":{"tsconfig":{"rootDir":"."}}}'

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # ==========================================
  # BUILD CHECK
  # ==========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ==========================================
  # DEPLOY — Backend deploys to Render.com (auto-deploy from main branch)
  # ==========================================
  # No manual deploy step needed — Render watches the repo directly.
