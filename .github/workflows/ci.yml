name: CI/CD Pipeline

on:
  push:
    branches: [main, preproduction, development]
  pull_request:
    branches: [main, preproduction, development]

env:
  NODE_VERSION: '24.13.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ==========================================
  # LINT & TYPE CHECK
  # ==========================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma Schema Validate
        run: pnpm exec prisma validate

      - name: Run ESLint
        run: pnpm run lint

      - name: Install deterministic IANA build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gawk

      - name: Verify authenticated IANA timezone sources
        run: pnpm verify:iana-timezones
        env:
          IANA_TZDB_RELEASE_SHA512: ${{ vars.IANA_TZDB_RELEASE_SHA512 }}
          IANA_TZDB_SIGNER_FINGERPRINT: ${{ vars.IANA_TZDB_SIGNER_FINGERPRINT }}
          IANA_TZDB_SIGNER_PUBLIC_KEY_B64: ${{ vars.IANA_TZDB_SIGNER_PUBLIC_KEY_B64 }}

      - name: Type check
        run: pnpm run build

  # ==========================================
  # UNIT TESTS
  # ==========================================
  backend_unit_tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALLOW_AUTHORIZATION_P0_INTEGRATION_DB: '1'
      AUTHORIZATION_P0_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run unit tests
        # TypeScript 6 requires an explicit rootDir when ts-jest compiles each
        # spec file in isolation; keep the CI gate blocking without changing
        # the project tsconfig in this hardening slice.
        # Cap workers: AUTHORIZATION_P0 dbIt suites share one Postgres and use
        # ACCESS EXCLUSIVE locks; high parallelism flakes on lock/statement timeouts.
        run: pnpm jest --coverage --passWithNoTests --maxWorkers=50% --globals '{"ts-jest":{"tsconfig":{"rootDir":"."}}}'

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  redis_contract:
    name: Redis Contract
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ALLOW_REDIS_INTEGRATION: '1'
      REDIS_INTEGRATION_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run Redis contract
        run: pnpm exec jest --runInBand --runTestsByPath src/config/redis-throttler.storage.integration.spec.ts --testPathIgnorePatterns='^$' --globals '{"ts-jest":{"tsconfig":{"rootDir":"."}}}'

  backend_e2e_tests:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: sacdia_e2e
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sacdia_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sacdia_e2e
      REDIS_URL: redis://127.0.0.1:6379
      # Dummy secrets: e2e suites mock BetterAuthService/R2/Resend transports,
      # but env validation and eager constructors require non-empty values.
      BETTER_AUTH_SECRET: e2e-ci-secret-with-at-least-32-characters
      EMAIL_ENABLED: 'false'
      RESEND_API_KEY: re_test_dummy_key
      RESEND_FROM_EMAIL: SACDIA <test@test.local>
      R2_BUCKET_HONORS_PDF: test
      R2_PUBLIC_URL_HONORS_PDF: https://r2.test
      R2_BUCKET_EVIDENCE_FILES: test
      R2_PUBLIC_URL_EVIDENCE_FILES: https://r2.test
      R2_BUCKET_INSURANCE_EVIDENCE: test
      R2_PUBLIC_URL_INSURANCE_EVIDENCE: https://r2.test
      R2_BUCKET_DATA_EXPORTS: test
      R2_PUBLIC_URL_DATA_EXPORTS: https://r2.test
      R2_BUCKET_MONTHLY_REPORTS: test
      R2_PUBLIC_URL_MONTHLY_REPORTS: https://r2.test
      R2_BUCKET_RESOURCES_FILES: test
      R2_PUBLIC_URL_RESOURCES_FILES: https://r2.test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      # The migration history is not replayable from an empty database
      # (pre-baseline drift: e.g. weekly_records.year and the scoring tables
      # are never created by any migration). Until that history is repaired,
      # the e2e schema is materialized directly from schema.prisma.
      - name: Create database schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS "extensions";
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp" SCHEMA "extensions";
          CREATE SCHEMA IF NOT EXISTS "auth";
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID AS $$
            SELECT gen_random_uuid()
          $$ LANGUAGE sql;
          SQL
          pnpm prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script > /tmp/e2e-schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f /tmp/e2e-schema.sql

      # I18nModule loads translations from dist/i18n (process.cwd() anchor in
      # src/app.module.ts). The e2e job never runs `nest build`, so copy the
      # source assets to the path the loader expects.
      - name: Stage i18n assets
        run: mkdir -p dist && cp -R src/i18n dist/i18n

      # classes-progress-migration.e2e-spec.ts validates the FS-03 backfill SQL
      # that lives in the monorepo canonical docs (../../docs relative to test/,
      # i.e. one level above this repo checkout in the monorepo layout).
      - name: Stage canonical docs
        run: |
          git clone --depth=1 https://github.com/abn-r/sacdia.git /tmp/sacdia-canonical
          cp -R /tmp/sacdia-canonical/docs "$GITHUB_WORKSPACE/../docs"

      # Blocking subset: suites verified green against an ephemeral database.
      # The remaining suites drifted while e2e was not in CI (stale specs) and
      # are tracked for re-alignment in docs/api/TESTING-GUIDE.md — add each
      # one back here as it gets fixed.
      - name: Run E2E tests (blocking suites)
        run: |
          pnpm test:e2e --runInBand --forceExit --runTestsByPath \
            test/activities.e2e-spec.ts \
            test/app.e2e-spec.ts \
            test/auth.e2e-spec.ts \
            test/certifications.e2e-spec.ts \
            test/classes-progress-migration.e2e-spec.ts \
            test/clubs.e2e-spec.ts \
            test/field-payment-orders.e2e-spec.ts \
            test/finances.e2e-spec.ts \
            test/insurance.e2e-spec.ts \
            test/member-rankings.e2e-spec.ts \
            test/notifications-security.e2e-spec.ts \
            test/section-rankings.e2e-spec.ts

  cross_repo_contract:
    name: Cross-repo Contract
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    env:
      SACDIA_ROOT_CONTRACT_REF: ${{ vars.SACDIA_ROOT_CONTRACT_REF }}
      SACDIA_ADMIN_CONTRACT_REF: ${{ vars.SACDIA_ADMIN_CONTRACT_REF }}
      SACDIA_APP_CONTRACT_REF: ${{ vars.SACDIA_APP_CONTRACT_REF }}

    steps:
      - name: Validate immutable contract refs
        run: |
          for ref in \
            "$SACDIA_ROOT_CONTRACT_REF" \
            "$SACDIA_ADMIN_CONTRACT_REF" \
            "$SACDIA_APP_CONTRACT_REF"
          do
            [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || exit 1
          done

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout canonical docs
        run: |
          git init .contract-sources/sacdia
          git -C .contract-sources/sacdia fetch --depth=1 https://github.com/abn-r/sacdia.git "$SACDIA_ROOT_CONTRACT_REF"
          git -C .contract-sources/sacdia checkout --detach FETCH_HEAD

      - name: Checkout admin consumer
        uses: actions/checkout@v4
        with:
          repository: abn-r/sacdia-admin
          ref: ${{ env.SACDIA_ADMIN_CONTRACT_REF }}
          path: .contract-sources/sacdia-admin
          persist-credentials: false

      - name: Checkout Flutter consumer
        uses: actions/checkout@v4
        with:
          repository: abn-r/sacdia-app
          ref: ${{ env.SACDIA_APP_CONTRACT_REF }}
          path: .contract-sources/sacdia-app
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact cross-repository contract
        env:
          ALLOW_AUTHORIZATION_P0_CROSS_REPO: '1'
          SACDIA_ADMIN_ROOT: ${{ github.workspace }}/.contract-sources/sacdia-admin
          SACDIA_APP_ROOT: ${{ github.workspace }}/.contract-sources/sacdia-app
          SACDIA_CANONICAL_DOCS_ROOT: ${{ github.workspace }}/.contract-sources/sacdia
        run: pnpm exec jest --runTestsByPath src/common/verify-authorization-director-succession-p0-crossrepo.spec.ts

  required_unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [backend_unit_tests, cross_repo_contract, redis_contract, backend_e2e_tests]
    if: ${{ always() }}
    steps:
      - name: Require all test gates
        env:
          BACKEND_RESULT: ${{ needs.backend_unit_tests.result }}
          CROSS_REPO_RESULT: ${{ needs.cross_repo_contract.result }}
          REDIS_RESULT: ${{ needs.redis_contract.result }}
          E2E_RESULT: ${{ needs.backend_e2e_tests.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$CROSS_REPO_RESULT" = success
          test "$REDIS_RESULT" = success
          test "$E2E_RESULT" = success

  # ==========================================
  # BUILD CHECK
  # ==========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: required_unit_tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ==========================================
  # DEPLOY — Backend deploys to Render.com (auto-deploy from main branch)
  # ==========================================
  # No manual deploy step needed — Render watches the repo directly.
