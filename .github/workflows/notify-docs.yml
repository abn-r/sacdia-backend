name: Notify sacdia-docs of source changes

# Triggers sacdia-docs sync workflow when backend changes that affect
# generated artifacts (OpenAPI spec, Prisma schema, package versions) land
# on main.

on:
  push:
    branches: [main]
    paths:
      - 'prisma/schema.prisma'
      - 'src/**/*.controller.ts'
      - 'src/**/*.dto.ts'
      - 'src/main.ts'
      - 'package.json'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sacdia-docs repository_dispatch
        run: |
          curl --fail -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.SACDIA_REPO_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/abn-r/sacdia-docs/dispatches \
            -d '{"event_type":"sacdia-source-changed","client_payload":{"source":"sacdia-backend","sha":"${{ github.sha }}"}}'
